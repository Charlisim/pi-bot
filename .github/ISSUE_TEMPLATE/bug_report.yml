name: Bug report
description: Report a reproducible Pi Bot problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here. Use the Security tab.
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Pi Bot, Pi, pi-subagents, Node.js, OS, and terminal versions.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
